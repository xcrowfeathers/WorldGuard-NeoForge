plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url = 'https://maven.enginehub.org/repo/'
        metadataSources {
            mavenPom()
            artifact()
            ignoreGradleMetadataRedirection()
        }
    }
    mavenCentral()
}

// Minecraft 1.21.1 pins Guava to 32.1.2 while EngineHub's 7.3.x POM
// requests 32.1.3. Use Minecraft's supplied library at runtime.
configurations.configureEach {
    resolutionStrategy.force 'com.google.guava:guava:32.1.2-jre'
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        worldguard {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    testImplementation 'com.google.guava:guava:32.1.2-jre'
    // WorldEdit is a required, separately installed NeoForge mod.
    implementation 'com.sk89q.worldedit:worldedit-neoforge-mc1.21:7.3.8'
    additionalRuntimeClasspath 'com.sk89q.worldedit:worldedit-core:7.3.8'

    // Package the official WorldGuard engine and its non-mod dependencies.
    implementation 'com.sk89q.worldguard:worldguard-core:7.0.12'
    implementation 'com.sk89q.worldguard.worldguard-libs:core:7.0.12'
    jarJar(implementation('org.flywaydb:flyway-core:3.0')) {
        version { strictly '3.0' }
    }
    jarJar(implementation('org.yaml:snakeyaml:2.0')) {
        version { strictly '2.0' }
    }
    jarJar(implementation('org.xerial:sqlite-jdbc:3.46.1.3')) {
        version { strictly '3.46.1.3' }
    }
    additionalRuntimeClasspath 'com.sk89q.worldguard:worldguard-core:7.0.12'
    additionalRuntimeClasspath 'com.sk89q.worldguard.worldguard-libs:core:7.0.12'
    additionalRuntimeClasspath 'org.flywaydb:flyway-core:3.0'
    additionalRuntimeClasspath 'org.yaml:snakeyaml:2.0'
    additionalRuntimeClasspath 'org.xerial:sqlite-jdbc:3.46.1.3'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replacements = [minecraft_version_range: minecraft_version_range,
                        neo_version_range: neo_version_range,
                        loader_version_range: loader_version_range,
                        mod_id: mod_id, mod_name: mod_name,
                        mod_license: mod_license, mod_version: mod_version,
                        mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties replacements
    expand replacements
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.register('regionSelfTest', JavaExec) {
    group = 'verification'
    description = 'Exercise Core region mutation, spatial queries, and save/load without a game server.'
    dependsOn tasks.testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.kuro.worldguard.platform.RegionLifecycleSelfTest'
}

tasks.register('protectionSemanticsSelfTest', JavaExec) {
    group = 'verification'
    description = 'Verify Core build, flag, group, priority, and inheritance behavior used by player protection.'
    dependsOn tasks.testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.kuro.worldguard.platform.ProtectionSemanticsSelfTest'
}

tasks.register('environmentalConfigSelfTest', JavaExec) {
    group = 'verification'
    description = 'Verify WorldGuard environmental configuration defaults and overrides.'
    dependsOn tasks.testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.kuro.worldguard.platform.EnvironmentalConfigSelfTest'
}

tasks.register('sessionSemanticsSelfTest', JavaExec) {
    group = 'verification'
    description = 'Verify Core session transitions, timed flags, natural player flags, and command filtering.'
    dependsOn tasks.testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.kuro.worldguard.platform.SessionSemanticsSelfTest'
}

tasks.register('platformIntegrationSelfTest', JavaExec) {
    group = 'verification'
    description = 'Exercise Core custom flags, custom session handlers, global regions, and offline profiles.'
    dependsOn tasks.testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.kuro.worldguard.platform.PlatformIntegrationSelfTest'
}

tasks.register('blacklistSelfTest', JavaExec) {
    group = 'verification'
    description = 'Verify Core blacklist parsing, exemptions, dimension isolation, and reload.'
    dependsOn tasks.testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.kuro.worldguard.platform.BlacklistSelfTest'
}

tasks.register('corePerfBenchmark', JavaExec) {
    group = 'verification'
    description = 'Run a development-only WorldGuard Core spatial-query and blacklist workload.'
    dependsOn tasks.testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.kuro.worldguard.platform.CorePerformanceBenchmark'
    maxHeapSize = '2g'
}

tasks.named('check') {
    dependsOn tasks.named('regionSelfTest')
    dependsOn tasks.named('protectionSemanticsSelfTest')
    dependsOn tasks.named('environmentalConfigSelfTest')
    dependsOn tasks.named('sessionSemanticsSelfTest')
    dependsOn tasks.named('platformIntegrationSelfTest')
    dependsOn tasks.named('blacklistSelfTest')
}

// Core references WorldEdit game classes and must live in the mod module, not the
// parent library module used for plain nested jars. Preserve the official bytecode.
configurations { embeddedEngine { transitive = false } }
dependencies {
    embeddedEngine 'com.sk89q.worldguard:worldguard-core:7.0.12'
    embeddedEngine 'com.sk89q.worldguard.worldguard-libs:core:7.0.12'
}
tasks.named('jar', Jar) {
    from({ configurations.embeddedEngine.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}